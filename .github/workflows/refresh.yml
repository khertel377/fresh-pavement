name: Refresh pavement data

on:
  # Monthly: 1st of each month at 8 AM UTC.
  # editingInfo check skips unchanged sources, so running every month is fine.
  schedule:
    - cron: '0 8 1 * *'
  # Manual trigger in GitHub → Actions tab
  workflow_dispatch:

permissions:
  contents: write   # commit updated data back to repo
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from ArcGIS sources
        run: npm run fetch

      - name: Build segments.geojson + distribution report
        run: npm run build

      - name: Run score verification
        run: npm run check-scores

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          git diff --staged --quiet || git commit -m "chore: refresh pavement data $(date -u +%Y-%m-%d)"
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
